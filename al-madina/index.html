<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a1220" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./favicon.svg" />
  <title>AL-MADINA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ─── Design tokens ─────────────────────────────────────────────
       One source of truth for colors, typography, and shared button
       styles. All game UI modules read from these. */
    :root {
      --am-font: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

      --am-gold: #ffcc33;
      --am-gold-deep: #ff9a00;
      --am-cyan: #33ccff;
      --am-cyan-deep: #0088cc;
      --am-danger: #e05570;
      --am-danger-deep: #c23352;
      --am-success: rgba(34, 160, 80, 0.85);
      --am-warn: rgba(224, 122, 42, 0.85);

      --am-dark-1: #0a1220;
      --am-dark-2: #17263b;

      --am-glass: rgba(0, 0, 0, 0.55);
      --am-glass-strong: rgba(0, 0, 0, 0.75);

      --am-radius-pill: 999px;
      --am-radius-card: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #000;
      font-family: var(--am-font);
      color: #fff;
      /* Stop iOS Safari from rubber-banding the page when the player drags
         on the canvas — kills the "page bounces while you steer" feel. */
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    /* Treat all UI overlays as non-selectable so taps don't accidentally
       open the iOS share sheet or summon a text-selection cursor. */
    #joystick-zone, #touch-jump, #touch-action,
    #mission-hud, #mission-compass, #mode-indicator,
    #shift-summary, #orientation-warning {
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
    }

    /* ─── Shared pill button (primary = gold, danger = coral) ─────── */
    .am-btn {
      pointer-events: auto; cursor: pointer;
      border: none; font: inherit;
      font-family: var(--am-font);
      font-weight: 700; font-size: 0.74rem;
      letter-spacing: 0.09em; text-transform: uppercase;
      padding: 10px 20px; border-radius: var(--am-radius-pill);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      transition: transform 0.1s ease, filter 0.12s ease;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .am-btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .am-btn:active { transform: translateY(0); filter: brightness(0.94); }
    .am-btn-primary {
      background: linear-gradient(90deg, var(--am-gold), var(--am-gold-deep));
      color: var(--am-dark-1);
    }
    .am-btn-danger {
      background: var(--am-danger);
      color: #fff;
    }
    .am-btn-danger:hover { background: var(--am-danger-deep); filter: none; }

    /* ─── Loading screen ──────────────────────────────────────────── */
    #loading-screen {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--am-dark-1) 0%, var(--am-dark-2) 60%, #1e3a5f 100%);
      transition: opacity 0.6s ease;
    }
    #loading-screen.fade-out { opacity: 0; pointer-events: none; }
    #loading-title {
      font-family: var(--am-font);
      font-size: 3rem; font-weight: 800; letter-spacing: 0.3em;
      text-transform: uppercase; margin-bottom: 2rem;
      background: linear-gradient(90deg, var(--am-gold), var(--am-gold-deep));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #loading-bar-container {
      width: min(80%, 400px); height: 6px;
      background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden;
    }
    #loading-bar {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, var(--am-gold), var(--am-gold-deep));
      border-radius: 3px; transition: width 0.3s ease;
    }
    #loading-text {
      margin-top: 1rem; font-size: 0.85rem; color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.1em; font-weight: 500;
    }

    /* ─── Touch controls ──────────────────────────────────────────────
       Layout (right-handed default):
         · Action (ENTER/EXIT) — primary, biggest, lowest-right
         · Jump — secondary, sits left of Action
       Both honor iOS safe-area insets so the home-indicator never
       eats them on iPhone. */
    .touch-btn {
      display: none; position: fixed; z-index: 100;
      border-radius: 50%;
      color: #fff; font-family: var(--am-font); font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      touch-action: manipulation; user-select: none;
      align-items: center; justify-content: center;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
      transition: transform 0.08s ease, background 0.15s ease, opacity 0.2s ease;
    }
    .touch-btn:active { transform: scale(0.94); }

    #touch-action {
      width: 88px; height: 88px;
      bottom: max(28px, env(safe-area-inset-bottom));
      right: max(28px, env(safe-area-inset-right));
      font-size: 0.78rem;
      background: rgba(255, 204, 51, 0.15);
      border: 2px solid rgba(255, 204, 51, 0.55);
      color: var(--am-gold);
    }
    #touch-action.is-active {
      background: linear-gradient(135deg, var(--am-gold), var(--am-gold-deep));
      color: var(--am-dark-1);
      border-color: transparent;
      box-shadow: 0 6px 18px rgba(255, 154, 0, 0.45);
    }
    #touch-action.is-disabled { opacity: 0.45; }

    #touch-jump {
      width: 64px; height: 64px;
      bottom: max(36px, env(safe-area-inset-bottom));
      right: calc(max(28px, env(safe-area-inset-right)) + 110px);
      font-size: 0.78rem;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
    }
    #touch-jump:active { background: rgba(255, 255, 255, 0.3); }

    #joystick-zone {
      display: none; position: fixed;
      bottom: 0;
      left: env(safe-area-inset-left, 0);
      width: 50%; height: 40%; z-index: 100;
    }

    /* ─── Debug overlay ───────────────────────────────────────────── */
    #debug-info {
      display: none; position: fixed; top: 10px; left: 10px; z-index: 100;
      font-family: 'SF Mono', ui-monospace, monospace; font-size: 12px;
      color: var(--am-gold);
      background: var(--am-glass-strong);
      padding: 8px 10px; border-radius: 6px;
      pointer-events: none; white-space: pre;
    }

    /* ─── Mode indicator (CHARACTER MODE / CAMERA MODE) ───────────── */
    #mode-indicator {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      z-index: 100;
      font-family: var(--am-font);
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff; background: var(--am-glass);
      padding: 8px 14px; border-radius: var(--am-radius-pill);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      pointer-events: none; user-select: none;
      transition: background 0.3s ease, color 0.3s ease;
    }
    #mode-indicator.camera-mode {
      background: var(--am-gold);
      color: var(--am-dark-1);
    }
    #mode-indicator .hint {
      display: block; font-size: 0.58rem; font-weight: 500;
      opacity: 0.7; margin-top: 2px; letter-spacing: 0.06em;
    }

    /* ─── Rotate-device overlay ─────────────────────────────────────
       Game is built for landscape — portrait crops the world badly.
       Shown only when the device is touch + portrait. */
    #orientation-warning {
      display: none; position: fixed; inset: 0; z-index: 1500;
      background: linear-gradient(135deg, var(--am-dark-1), var(--am-dark-2));
      flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; text-align: center; padding: 24px;
    }
    #orientation-warning .ow-icon {
      width: 72px; height: 48px;
      border: 3px solid var(--am-gold);
      border-radius: 6px;
      position: relative;
      animation: ow-rotate 1.6s ease-in-out infinite;
    }
    #orientation-warning .ow-icon::after {
      content: ''; position: absolute;
      width: 4px; height: 4px;
      background: var(--am-gold);
      border-radius: 50%;
      bottom: 6px; left: 50%; transform: translateX(-50%);
    }
    #orientation-warning .ow-title {
      font-size: 1.05rem; font-weight: 800; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--am-gold);
    }
    #orientation-warning .ow-sub {
      font-size: 0.82rem; opacity: 0.75; max-width: 280px;
    }
    @keyframes ow-rotate {
      0%, 100% { transform: rotate(-90deg); }
      50%      { transform: rotate(0deg); }
    }

    /* ─── Mobile / touch responsive rules ───────────────────────────
       `pointer: coarse` matches phones/tablets. We hide the
       Tab-switching mode indicator (no Tab key) and show the rotate
       overlay when the device is in portrait. */
    @media (pointer: coarse) {
      #mode-indicator { display: none; }
    }
    @media (pointer: coarse) and (orientation: portrait) {
      #orientation-warning { display: flex; }
    }
    /* Narrow viewports (small phones in landscape) — tighten HUD pills
       so they don't collide. */
    @media (max-width: 720px) {
      #loading-title { font-size: 2rem; letter-spacing: 0.22em; }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-DYWtnHRf.js"></script>
</head>
<body>
  <div id="loading-screen">
    <div id="loading-title">AL-MADINA</div>
    <div id="loading-bar-container"><div id="loading-bar"></div></div>
    <div id="loading-text">Initializing...</div>
  </div>
  <div id="joystick-zone"></div>
  <button id="touch-jump" class="touch-btn">Jump</button>
  <button id="touch-action" class="touch-btn">Enter</button>
  <div id="debug-info"></div>
  <div id="mode-indicator">CHARACTER MODE<span class="hint">TAB to toggle</span></div>
  <div id="orientation-warning">
    <div class="ow-icon"></div>
    <div class="ow-title">Rotate Your Device</div>
    <div class="ow-sub">Al-Madina is best played in landscape.</div>
  </div>
</body>
</html>
